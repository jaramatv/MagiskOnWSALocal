name: Suno Downloader

on:
  push:
    branches: [ "ccr-9f7a9151-nta6xh" ]
    paths: [ "SunoDownloader/**", ".github/workflows/suno-downloader.yml", "!SunoDownloader/release/**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: SunoDownloader
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK release y APK de tests
        run: ./gradlew --no-daemon assembleRelease assembleDebug assembleDebugAndroidTest

      - name: Tests unitarios
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Herramientas
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null

      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: Emulador - tests instrumentados y E2E de la APK release
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          working-directory: SunoDownloader
          script: bash tools/ci_emulator.sh

      - name: Publicar APK y resultados en la rama
        if: always()
        run: |
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk release/SunoDownloader-1.0.0.apk || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release
          git commit -m "CI: APK y resultados de pruebas (${GITHUB_SHA::7})" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SunoDownloader
          path: |
            SunoDownloader/app/build/outputs/apk/release/app-release.apk
            SunoDownloader/release/
